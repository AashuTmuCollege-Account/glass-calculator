<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080f">
<meta name="description" content="A Samsung-style calculator with Apple-style cubic glass materials.">
<title>Glass Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calc" aria-label="Calculator">
    <section class="screen">
      <p class="expr" id="expr"><bdi dir="ltr"></bdi></p>
      <output class="result" id="result" aria-live="polite">0</output>
    </section>

    <div class="pad" id="pad">
      <button class="key fn" data-k="AC">AC</button>
      <button class="key fn" data-k="⌫" aria-label="Backspace">⌫</button>
      <button class="key fn" data-k="%" aria-label="Percent">%</button>
      <button class="key op" data-k="÷" aria-label="Divide">÷</button>

      <button class="key" data-k="7">7</button>
      <button class="key" data-k="8">8</button>
      <button class="key" data-k="9">9</button>
      <button class="key op" data-k="×" aria-label="Multiply">×</button>

      <button class="key" data-k="4">4</button>
      <button class="key" data-k="5">5</button>
      <button class="key" data-k="6">6</button>
      <button class="key op" data-k="−" aria-label="Subtract">−</button>

      <button class="key" data-k="1">1</button>
      <button class="key" data-k="2">2</button>
      <button class="key" data-k="3">3</button>
      <button class="key op" data-k="+" aria-label="Add">+</button>

      <button class="key" data-k="±" aria-label="Toggle sign">±</button>
      <button class="key" data-k="0">0</button>
      <button class="key" data-k="." aria-label="Decimal point">.</button>
      <button class="key eq" data-k="=" aria-label="Equals">=</button>
    </div>
  </main>

  <script src="calc.js"></script>
  <script src="app.js"></script>
</body>
</html>
